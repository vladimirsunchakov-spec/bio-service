[tool.poetry]
name = "bio-service"
version = "0.1.0"
description = "Bio service for author additional info"
authors = ["Vladimir Sunchakov <vladimiroff777@rambler.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.138.0"
uvicorn = "^0.49.0"
sqlalchemy = "^2.0.51"
asyncpg = "^0.31.0"
aiosqlite = "^0.22.1"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.2"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"